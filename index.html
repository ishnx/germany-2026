:root{--ink:#23252c;--ink2:#3a3c44;--mut:#98938a;--line:#e2ddcf;--paper:#fbfaf7;--card:#fff;--gold:#a08d6d;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
body{font-family:"TravelSans","TravelDev","Noto Sans","Noto Sans Devanagari",sans-serif;background:var(--paper);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom));}
.mr{font-family:"TravelSans","TravelDev","Noto Sans","Noto Sans Devanagari",sans-serif}
.hdr{position:sticky;top:0;background:rgba(251,250,247,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 18px 12px;z-index:10}
.hdr-t{font-family:"TravelSerif","Noto Serif",serif;font-weight:600;font-size:20px}
.hdr-s{font-size:12.5px;color:var(--mut);margin-top:2px}
.wrap{padding:16px 16px 24px;max-width:640px;margin:0 auto}
.chip{display:inline-block;color:#fff;font-weight:700;font-size:14px;letter-spacing:1.5px;padding:6px 16px;border-radius:99px}
.big-date{font-family:"TravelSerif","Noto Serif",serif;font-size:27px;font-weight:600;margin-top:12px}
.big-city{font-size:19px;font-weight:600;color:#4a4c55;margin-top:3px}
.big-mr{font-size:14px;color:var(--mut);margin-top:2px}
.blk-t{font-size:12px;font-weight:700;letter-spacing:2px;color:#8f8a7c;margin:26px 0 10px;text-transform:uppercase}
.tl{display:flex;align-items:flex-start;margin-bottom:10px}
.tl-t{flex:0 0 92px;font-weight:700;font-size:14px;padding-top:2px}
.tl-x{font-size:16px;line-height:1.5;color:#33353d}
.bk{color:#1d6b3a;font-weight:700}.buy{color:#b3402f;font-weight:700}
.note{border-left:4px solid #c8b89a;background:#f4f0e7;padding:12px 14px;font-size:15px;line-height:1.55;color:#4c4a42;border-radius:0 10px 10px 0;margin-top:14px}
.warn{border-left:4px solid #cf9a52;background:#fbf3e4;padding:12px 14px;font-size:15px;line-height:1.55;color:#5c4f35;border-radius:0 10px 10px 0}
.hotel{background:var(--card);border:1.5px solid #ddd7c9;border-radius:16px;padding:18px;margin-bottom:12px}
.h-flag{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold)}
.h-name{font-size:19px;font-weight:700;margin-top:8px}
.h-addr{font-size:23px;font-weight:700;line-height:1.35;margin-top:4px}
.h-check{font-size:13.5px;color:#8b8578;margin-top:6px}
.h-taxi{font-size:16px;font-weight:700;color:#4a4c55;margin-top:12px;padding-top:10px;border-top:1px dashed #d8d2c2}
.h-taxi span{font-weight:400;color:var(--mut);font-size:13px}
.sight{font-size:16px;line-height:1.55;color:#33353d;margin-bottom:9px;padding-left:20px;position:relative}
.sight::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:3px;background:#c8b89a}
.pc{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 18px 20px;margin-bottom:18px;position:relative;cursor:pointer}
.pc:active{background:#f5f2ea}
.pc-num{position:absolute;top:14px;right:16px;font-size:12px;font-weight:700;color:#c9c3b2}
.pc-mr{font-size:18px;line-height:1.55;color:var(--ink2)}
.pc-en{font-size:14px;color:var(--mut);margin-top:3px}
.pc-hr{height:1px;background:#ece7da;margin:12px 0}
.pc-de{font-size:27px;font-weight:700;line-height:1.35;color:#1f2230}
.hero{border-width:2.5px;padding:22px}
.hero .pc-de{font-size:32px}
.hero-flag{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold);margin-bottom:10px}
.navbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-b{flex:1;padding:10px 4px 8px;text-align:center;font-size:12.5px;font-weight:600;color:#8f8a7c;cursor:pointer}
.nav-b .ic{font-size:21px;display:block;margin-bottom:2px}
.nav-b.on{color:var(--ink)}
.sit-b{display:flex;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.sit-b:active{background:#f5f2ea}
.sit-dot{flex:0 0 14px;height:38px;border-radius:4px;margin-right:14px}
.sit-l{font-size:17.5px;font-weight:700}
.sit-m{font-size:13.5px;color:var(--mut);margin-top:2px}
.day-b{display:flex;align-items:baseline;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer}
.day-n{flex:0 0 64px;font-weight:800;font-size:15px}
.day-i{flex:1}
.day-c{font-size:16px;font-weight:600}
.day-d{font-size:13px;color:var(--mut);margin-top:1px}
.srch{width:100%;font-size:18px;font-family:inherit;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:16px}
.banner{border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;margin-bottom:18px}
.em2{display:flex;gap:12px;margin-bottom:14px}
.em-b{flex:1;background:#b03a2e;color:#fff;border-radius:14px;padding:14px;text-align:center}
.em-d{font-size:34px;font-weight:800}
.em-w{font-size:13.5px;margin-top:2px;font-weight:600}
.em-m{font-size:12px;margin-top:2px;opacity:.85}
.icard{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.icard-l{font-size:11px;font-weight:700;letter-spacing:1.5px;color:var(--gold)}
.icard-b{font-size:18px;font-weight:700;margin-top:6px;line-height:1.4}
.icard-s{font-size:13.5px;color:#7d7869;margin-top:3px;line-height:1.5}
.zoom{position:fixed;inset:0;background:#fbfaf7;z-index:50;display:flex;flex-direction:column;justify-content:center;padding:28px;cursor:pointer}
.zoom-mr{font-size:21px;color:var(--ink2);line-height:1.6}
.zoom-en{font-size:16px;color:var(--mut);margin-top:6px}
.zoom-hr{height:2px;background:#d8d2c2;margin:22px 0}
.zoom-de{font-size:44px;font-weight:800;line-height:1.3;color:#1f2230}
.zoom-x{position:absolute;top:18px;right:20px;font-size:15px;color:var(--mut);font-weight:700}
.wi{background:#fdf6ec;border:2px dashed #cf9a52;border-radius:16px;padding:18px}
.wi-f{font-size:12px;font-weight:700;letter-spacing:1.2px;color:#a35c14}
.wi-n{font-size:14.5px;color:#7a6a4e;margin-top:8px;line-height:1.55}
.wi-in{width:100%;font-family:inherit;font-size:18px;padding:12px;margin-top:12px;border:1.5px solid #d9c4a0;border-radius:10px;background:#fff}
.hint{font-size:13.5px;color:var(--mut);line-height:1.6;margin:18px 4px}

.spk{display:block;width:100%;margin:22px 0 6px;padding:20px 16px;font-size:22px;font-weight:800;letter-spacing:.2px;border:none;border-radius:16px;background:#22242e;color:#fbfaf7;font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.spk:active{background:#3a3d4d;transform:scale(.985)}
.spk .spk-sub{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="navbar" id="nav"></nav>
<div class="zoom" id="zoom" style="display:none" onclick="this.style.display='none'">
  <div class="zoom-x">CLOSE · बंद करा ✕</div>
  <div class="zoom-mr" id="z-mr"></div><div class="zoom-en" id="z-en"></div>
  <div class="zoom-hr"></div><div class="zoom-de" id="z-de"></div>
  <button class="spk" id="z-spk" onclick="event.stopPropagation();speakCurrent()">&#128266; ऐकवा · PLAY GERMAN<span class="spk-sub">tap to hear it again · पुन्हा ऐकण्यासाठी दाबा</span></button>
</div>
<script>
let currentDe = "";
let deVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    deVoice = vs.find(v=>/^de([-_]|$)/i.test(v.lang) && /google/i.test(v.name))
           || vs.find(v=>/^de-DE/i.test(v.lang))
           || vs.find(v=>/^de([-_]|$)/i.test(v.lang))
           || null;

const $app = document.getElementById("app");

function localISO(){
  const q = new URLSearchParams(location.search).get("date");
  if(q && /^\d{4}-\d{2}-\d{2}$/.test(q)) return q;
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function mark(txt){

}

}

}
function hotelCard(h, flag){
  flag = flag || "OUR HOTEL - SHOW THIS TO A TAXI DRIVER · टॅक्सी चालकाला हे दाखवा";
  return `<div class="hotel"><div class="h-flag">${esc(flag)}</div>
    <div class="h-name">${esc(h.name)}</div><div class="h-addr">${esc(h.addr)}</div>
    ${h.check?`<div class="h-check">${esc(h.check)}</div>`:""}
    <div class="h-taxi">Bitte bringen Sie uns zu diesem Hotel. <span>(Please take us to this hotel)</span></div></div>`;
}
function berlinCard(){
  const saved = localStorage.getItem("berlinHotel")||"";
  return `<div class="wi"><div class="wi-f">HOTEL IN BERLIN - NOT BOOKED YET</div>
   <div class="wi-n">Ask Kirti or Vishwas where you are staying, and write it here.<br>किर्ती किंवा विश्वासांना विचारा आणि इथे लिहा.</div>
   <input class="wi-in" placeholder="Hotel name &amp; address · हॉटेलचं नाव व पत्ता" value="${esc(saved)}"
     oninput="localStorage.setItem('berlinHotel',this.value)"></div>`;
}
function munichCard(){
  return `<div class="warn"><b>Two Munich hotels are booked for these nights.</b> The family will confirm which one.<br>आज दोन हॉटेलं बुक आहेत - किर्ती/विश्वास सांगतील कोणतं.</div><div style="height:12px"></div>`
   + DATA.munichDouble.map(h=>hotelCard(h, h.tag)).join("");
}
function dayView(d, banner){
  let h = `<div class="hdr"><div class="hdr-t">${esc(d.city)}</div><div class="hdr-s">${esc(d.date)} · ${esc(d.wds)}</div></div><div class="wrap">`;
  if(banner) h += banner;
  h += `<span class="chip" style="background:${d.acc}">DAY ${d.n} OF 22</span>
    <div class="big-date">${esc(d.date)}</div>
    <div class="big-city">${esc(d.city)}</div><div class="big-mr">${esc(d.wds)} · ${esc(d.citymr)}</div>`;
  h += `<div class="blk-t">Today · आजचा कार्यक्रम</div>`;
  for(const [t,x] of d.today) h += `<div class="tl"><div class="tl-t">${esc(t)}</div><div class="tl-x">${mark(x)}</div></div>`;
  if(d.note) h += `<div class="note">${esc(d.note)}</div>`;
  h += `<div class="blk-t">Where we sleep · आमचं हॉटेल</div>`;
  if(d.hotel === "BERLIN_WRITEIN") h += berlinCard();
  else if(d.hotel === "MUNICH_DOUBLE") h += munichCard();
  else if(d.hotel) h += hotelCard(d.hotel);
  else h += `<div class="note">Tonight we sleep on the plane. · आज रात्र विमानात.</div>`;
  if(d.sights){
    h += `<div class="blk-t">${esc((d.sightsTitle||"Worth seeing"))} · पाहायला काय</div>`;
    for(const s of d.sights) h += `<div class="sight">${esc(s)}</div>`;
  }
  h += `<div class="blk-t">Phrases for today · आजची वाक्यं</div>
        <div class="hint">Tap any card to show it big. · कार्ड दाबा - मोठं दिसेल.</div>`;
  d.phrases.forEach((p,i)=> h += card(p, i+1));
  return h + "</div>";
}
function todayView(){
  const iso = localISO();
  const d = DATA.days.find(x=>x.iso===iso);
  if(d) return dayView(d, `<div class="banner" style="background:#e9f2e4;color:#2f4a24"><b>TODAY · आज</b> — this page follows your date automatically.</div>`);
  if(iso < DATA.tripStart){
    const n = Math.round((new Date(DATA.tripStart)-new Date(iso))/86400000);
    return dayView(DATA.days[0], `<div class="banner" style="background:#eef1f6;color:#3c4356">The trip starts in <b>${n} day${n>1?"s":""}</b> (9 September). · प्रवास ${n} दिवसांनी. Showing Day 1 below.</div>`);
  }
  if(iso === DATA.homeDate){
    return `<div class="hdr"><div class="hdr-t">Home today · घरी</div><div class="hdr-s">Thursday 1 October</div></div><div class="wrap">
     <div class="banner" style="background:#e9f2e4;color:#2f4a24"><b>Land in Mumbai at 5:10 am, Terminal 2.</b><br>सकाळी ५:१० ला मुंबई. Welcome home!</div>
     <div class="hint">All trip days are under <b>DAYS</b> below if you need them.</div></div>`;
  }
  return `<div class="hdr"><div class="hdr-t">Germany 2026</div><div class="hdr-s">कुलकर्णी कुटुंब</div></div><div class="wrap">
   <div class="banner" style="background:#eef1f6;color:#3c4356">The trip is over (9 - 30 September). Browse any day under <b>DAYS</b>. · प्रवास संपला.</div></div>`;
}
function daysView(){
  let h = `<div class="hdr"><div class="hdr-t">All days · सगळे दिवस</div><div class="hdr-s">9 - 30 September 2026</div></div><div class="wrap">`;
  for(const d of DATA.days)
    h += `<div class="day-b" onclick="go('day-${d.n}')"><div class="day-n" style="color:${d.acc}">DAY ${d.n}</div>
      <div class="day-i"><div class="day-c">${esc(d.city)}</div><div class="day-d">${esc(d.date)} · ${esc(d.citymr)}</div></div></div>`;
  return h+"</div>";
}
function sitsView(){
  let h = `<div class="hdr"><div class="hdr-t">Think it, find it · मदत</div><div class="hdr-s">Tap the situation you are in · तुमची परिस्थिती निवडा</div></div><div class="wrap">`;
  DATA.sits.forEach((s,i)=>{
    h += `<div class="sit-b" onclick="go('sit-${i}')"><div class="sit-dot" style="background:${s.acc}"></div>
      <div><div class="sit-l">${esc(s.label)}</div><div class="sit-m">${esc(s.mr)}</div></div></div>`;
  });
  return h+"</div>";
}
function sitView(i){
  const s = DATA.sits[i];
  let h = `<div class="hdr"><div class="hdr-t">${esc(s.label)}</div><div class="hdr-s">${esc(s.mr)}</div></div><div class="wrap">`;
  if(s.extra === "emerg"){
    h += `<div class="em2"><div class="em-b"><div class="em-d">112</div><div class="em-w">Ambulance &amp; Fire</div><div class="em-m">ॲम्ब्युलन्स / आग</div></div>
          <div class="em-b"><div class="em-d">110</div><div class="em-w">Police</div><div class="em-m">पोलीस</div></div></div>
     <div class="icard"><div class="icard-l">TRAVEL INSURANCE - ACKO</div>
      <div class="icard-b">Policy ACKTR2074915 · +91 22 6963 5374</div>
      <div class="icard-s">Call for hospital, theft or travel problems. 9 Sep - 1 Oct.</div></div>`;
  }
  if(s.extra === "embassy"){
    h += `<div class="icard"><div class="icard-l">INDIAN EMBASSY, BERLIN</div>
      <div class="icard-b">+49 30 25795-0</div><div class="icard-s">Tiergartenstr. 17, 10785 Berlin - for a lost passport.</div></div>`;
  }
  if(s.hero) h += `<div class="pc hero" onclick='zoom(${JSON.stringify(s.hero.mr)},${JSON.stringify(s.hero.en)},${JSON.stringify(s.hero.de)})'>
    <div class="hero-flag">SAY THIS FIRST · हे आधी दाखवा</div>
    <div class="pc-mr">${esc(s.hero.mr)}</div><div class="pc-en">${esc(s.hero.en)}</div>
    <div class="pc-hr"></div><div class="pc-de">${esc(s.hero.de)}</div></div>`;
  s.cards.forEach((p,j)=> h += card(p, j+1));
  return h+"</div>";
}
function searchView(q){
  let h = `<div class="hdr"><div class="hdr-t">Search · शोधा</div><div class="hdr-s">Type in Marathi, English or German</div></div><div class="wrap">
   <input class="srch" id="srch" placeholder="शोधा / search / suchen…" value="${esc(q||"")}" oninput="go('search', this.value)">`;
  if(q){
    const ql = q.toLowerCase();
    const hits = [];
    DATA.days.forEach(d=> d.phrases.forEach(p=>{ if((p.mr+p.en+p.de).toLowerCase().includes(ql)) hits.push([d,p]); }));
    DATA.sits.forEach(s=>{ (s.hero?[s.hero]:[]).concat(s.cards).forEach(p=>{ if((p.mr+p.en+p.de).toLowerCase().includes(ql)) hits.push([null,p]); }); });
    const seen = new Set(); const uniq = [];
    for(const [src,p] of hits){ if(!seen.has(p.de)){ seen.add(p.de); uniq.push(p); } }
    h += `<div class="hint">${uniq.length} result${uniq.length===1?"":"s"} · निकाल</div>`;
    uniq.slice(0,20).forEach(p=> h += card(p,""));
    if(!uniq.length) h += `<div class="hint">Nothing found - try another word. · काही सापडलं नाही.</div>`;
  } else {
    h += `<div class="hint">Try: ticket · तिकीट · doctor · डॉक्टर · vegetarian · शाकाहारी</div>`;
  }
  return h+"</div>";
}
const TABS = [["today","◉","Today · आज"],["days","▦","Days · दिवस"],["sits","!","Help · मदत"],["search","⌕","Search · शोधा"]];
let cur = new URLSearchParams(location.search).get("view") || "today", curArg = new URLSearchParams(location.search).get("q") || null;
function go(r, arg){ cur = r; curArg = arg; render(); }
function render(){
  let h = "";
  if(cur === "today") h = todayView();
  else if(cur === "days") h = daysView();
  else if(cur === "sits") h = sitsView();
  else if(cur === "search") h = searchView(curArg);
  else if(cur.startsWith("day-")) h = dayView(DATA.days[+cur.slice(4)-1], "");
  else if(cur.startsWith("sit-")) h = sitView(+cur.slice(4));
  $app.innerHTML = h;
  document.getElementById("nav").innerHTML = TABS.map(([r,ic,l])=>
    `<div class="nav-b${(cur===r||(r==='days'&&cur.startsWith('day-'))||(r==='sits'&&cur.startsWith('sit-')))?' on':''}" onclick="go('${r}')"><span class="ic">${ic}</span>${l}</div>`).join("");
  if(cur==="search"){ const el=document.getElementById("srch"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  if(cur!=="search") window.scrollTo(0,0);
}
render();
</script>
</body>
</html>
